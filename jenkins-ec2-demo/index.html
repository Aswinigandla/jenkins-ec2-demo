
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First DevOps Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4ff;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccd5e5;
        }

        h1 {
            color: #1456a0;
        }

        button {
            background: #1456a0;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Application!</h1>
        <p>I created this application using Visual Studio Code.</p>
        <p>My DevOps tools: Git, GitHub, Jenkins and AWS EC2.</p>
        <button onclick="showMessage()">Click Here</button>
        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Congratulations! Your application is working.";
        }
    </script>
</body>
</html>
